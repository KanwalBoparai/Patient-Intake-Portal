name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo pins pnpm@9.15.9 via packageManager and ships a
      # pnpm-lock.yaml, so `npm ci` would fail on the missing package-lock.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines requires >=18.18.0; Next.js itself wants
          # >=18.17.0. 20 is the current LTS and clears both.
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - run: pnpm run build
        env:
          # The only two variables the source reads. Placeholders are enough:
          # nothing connects to Supabase at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
